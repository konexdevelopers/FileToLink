<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07070a">
    <meta name="color-scheme" content="dark">
    <meta property="og:site_name" content="CineVortex">
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOSIgZmlsbD0iI2U1MjQyZiIvPjxwYXRoIGQ9Ik0xMi41IDkuNXYxM2wxMS02LjV6IiBmaWxsPSIjZmZmIi8+PC9zdmc+" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@600;700&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.9/plyr.css" />
    <title>%s | CineVortex</title>
    <style>
:root{--cv-bg:#07070a;--cv-bg2:#0b0b0f;--cv-card:#111116;--cv-card2:#15151c;--cv-line:rgba(255,255,255,.08);--cv-line2:rgba(255,255,255,.15);--cv-text:#f4f4f6;--cv-soft:#c9c9d3;--cv-muted:#9a9aa8;--cv-red:#e5242f;--cv-red2:#ff4b55;--cv-red-d:#b3121d;--cv-violet:#6d4aff;--cv-radius:20px;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:none;text-size-adjust:none}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--cv-bg);color:var(--cv-text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 10vw -140px,rgba(229,36,47,.22),transparent),radial-gradient(760px 480px at 92vw 0,rgba(109,74,255,.15),transparent),radial-gradient(1000px 600px at 50vw 105vh,rgba(40,70,200,.12),transparent),linear-gradient(180deg,#0b0b0f,#07070a)}
a{color:inherit}
:focus-visible{outline:2px solid var(--cv-red2);outline-offset:3px;border-radius:8px}
.cv-skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--cv-red);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;text-decoration:none}
.cv-skip:focus{top:12px}
.cv-wrap{max-width:1120px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.cv-wrap--narrow{max-width:560px}

/* header */
.cv-header{position:sticky;top:0;z-index:50;background:rgba(7,7,10,.72);-webkit-backdrop-filter:blur(16px) saturate(140);backdrop-filter:blur(16px) saturate(140);border-bottom:1px solid var(--cv-line);padding-top:env(safe-area-inset-top)}
.cv-header__row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}
.cv-brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:var(--cv-text)}
.cv-mark{flex:none;border-radius:9px;box-shadow:0 6px 22px rgba(229,36,47,.38)}
.cv-wordmark{font-family:"Sora","Inter",system-ui,sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1}
.cv-wordmark b{font-weight:700;background:linear-gradient(90deg,var(--cv-red2),var(--cv-red));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.cv-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border:1px solid var(--cv-line2);border-radius:999px;font-size:12.5px;font-weight:500;color:var(--cv-soft);background:rgba(255,255,255,.03)}
.cv-pill i{color:var(--cv-red2)}
.cv-strip{height:12px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 9px,transparent 9px 22px);opacity:.55;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18vw,#000 82vw,transparent);mask-image:linear-gradient(90deg,transparent,#000 18vw,#000 82vw,transparent)}

/* shared bits */
.cv-main{flex:1 0 auto;padding-top:clamp(24px,5vw,56px);padding-bottom:clamp(32px,6vw,72px)}
.cv-card{background:linear-gradient(180deg,var(--cv-card2),var(--cv-card));border:1px solid var(--cv-line);border-radius:var(--cv-radius);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.cv-eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cv-red2)}
.cv-name{margin:0 0 20px;min-width:0}
.cv-name p{margin:0}
#myDiv{display:block;font-family:"Sora","Inter",system-ui,sans-serif;font-weight:600;font-size:clamp(18px,3.4vw,26px);line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere;word-break:break-word;text-wrap:balance;color:var(--cv-text)}
.cv-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:11px;min-height:54px;padding:0 24px;border:1px solid var(--cv-line2);border-radius:16px;background:rgba(255,255,255,.04);color:var(--cv-text);font:inherit;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
.cv-btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.07)}
.cv-btn:active{transform:translateY(0)}
.cv-btn--primary{border-color:transparent;background:linear-gradient(135deg,var(--cv-red2),var(--cv-red),var(--cv-red-d));color:#fff;box-shadow:0 14px 36px -10px rgba(229,36,47,.65),inset 0 1px 0 rgba(255,255,255,.22)}
.cv-btn--primary:hover{border-color:transparent;background:linear-gradient(135deg,#ff6a72,var(--cv-red2),var(--cv-red));box-shadow:0 18px 44px -10px rgba(229,36,47,.8),inset 0 1px 0 rgba(255,255,255,.3)}
.cv-btn i{font-size:19px;line-height:1}
.cv-btn.is-busy{pointer-events:none;opacity:.8}
.cv-btn.is-busy i{animation:cv-pulse 1s ease-in-out infinite}
.cv-chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);font-size:13px;font-weight:600;letter-spacing:.01em}
.cv-chip:empty{display:none}
.cv-note{display:flex;align-items:flex-start;gap:12px;margin:0;padding:14px 16px;border:1px solid var(--cv-line);border-radius:16px;background:rgba(255,255,255,.03);color:var(--cv-soft);font-size:14px}
.cv-note i{flex:none;margin-top:2px;font-size:17px;color:var(--cv-red2)}
.cv-note--error{border-color:rgba(229,36,47,.45);background:rgba(229,36,47,.09);color:#ffd9dc}

/* footer */
.cv-footer{flex:none;margin-top:auto;border-top:1px solid var(--cv-line);background:rgba(7,7,10,.6);padding-top:30px;padding-bottom:max(26px,env(safe-area-inset-bottom))}
.cv-footer__row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px}
.cv-footer__line{margin:6px 0 0;font-size:14px;color:var(--cv-muted)}
.cv-footer__copy{margin:0;font-size:13px;color:var(--cv-muted)}

@keyframes cv-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cv-spin{to{transform:rotate(360deg)}}
@keyframes cv-pulse{from{opacity:1}to{opacity:.4}}
.cv-rise{animation:cv-rise .6s cubic-bezier(.2,.7,.2,1) both}
.cv-rise--2{animation-delay:.08s}
.cv-rise--3{animation-delay:.16s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:420px){.cv-pill{display:none}.cv-wordmark{font-size:19px}}

/* download card */
.cv-file{display:flex;flex-direction:column;overflow:hidden}
.cv-art{position:relative;display:grid;place-items:center;min-height:190px;background:radial-gradient(320px 220px at 50vw 0,rgba(229,36,47,.38),transparent),radial-gradient(280px 200px at 90vw 100vh,rgba(109,74,255,.32),transparent),linear-gradient(135deg,#1a0b10,#0d0d16 60vw,#0a0a12);border-bottom:1px solid var(--cv-line);overflow:hidden}
.cv-art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);pointer-events:none}
.cv-perf{position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 10px,transparent 10px 24px);opacity:.5}
.cv-perf--top{top:10px}.cv-perf--bot{bottom:10px}
.cv-ring{position:relative;z-index:1;display:grid;place-items:center;width:92px;height:92px;border-radius:999px;background:rgba(7,7,10,.55);border:1px solid rgba(255,255,255,.2);box-shadow:0 0 0 10px rgba(229,36,47,.1),0 0 60px rgba(229,36,47,.45);color:#fff;font-size:38px}
.cv-ext{position:absolute;z-index:2;right:16px;bottom:30px;padding:4px 11px;border-radius:10px;background:rgba(7,7,10,.7);border:1px solid var(--cv-line2);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--cv-soft)}
.cv-body{padding:26px 24px 26px}
#cv-download{display:flex;width:auto;min-height:58px;font-size:17px}
#cv-download .cv-chip{margin-left:4px}
.cv-hint{min-height:22px;margin:14px 0 0;text-align:center;font-size:13.5px;color:var(--cv-muted)}
@media (max-width:420px){.cv-body{padding:22px 18px 22px}.cv-art{min-height:160px}.cv-ring{width:78px;height:78px;font-size:32px}}
</style>
</head>

<body>
    <a class="cv-skip" href="#main">Skip to content</a>
    <header class="cv-header">
        <div class="cv-wrap cv-header__row">
            <span class="cv-brand" aria-label="CineVortex">
                <svg class="cv-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="9" fill="#e5242f"/><circle cx="16" cy="16" r="10.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.4"/><path d="M13 10.2v11.6l9.4-5.8z" fill="#fff"/></svg>
                <span class="cv-wordmark">Cine<b>Vortex</b></span>
            </span>
            <span class="cv-pill"><i class="bi bi-cloud-arrow-down-fill" aria-hidden="true"></i>Download</span>
        </div>
        <div class="cv-strip" aria-hidden="true"></div>
    </header>

    <main id="main" class="cv-main">
        <div class="cv-wrap cv-wrap--narrow">
            <article class="cv-card cv-file cv-rise">
                <div class="cv-art" aria-hidden="true">
                    <span class="cv-perf cv-perf--top"></span>
                    <span class="cv-ring"><i class="bi bi-film"></i></span>
                    <span id="cv-ext" class="cv-ext" hidden></span>
                    <span class="cv-perf cv-perf--bot"></span>
                </div>
                <div class="cv-body">
                    <p class="cv-eyebrow"><i class="bi bi-collection-play-fill" aria-hidden="true"></i> Your file</p>
                    <!-- file Name -> to be displayed here  -->
                    <div id="file-name" class="cv-name">
                        <p>
                            <span id="myDiv" class="card-title">%s</span>
                        </p>
                    </div>
                    <a id="cv-download" class="cv-btn cv-btn--primary" href="%s">
                        <i class="bi bi-download" aria-hidden="true"></i>
                        <span>Download</span>
                        <span class="cv-chip">%s</span>
                    </a>
                    <p id="cv-hint" class="cv-hint" role="status" aria-live="polite"></p>
                </div>
            </article>
        </div>
    </main>

    <footer class="cv-footer">
        <div class="cv-wrap cv-footer__row">
            <div>
                <span class="cv-brand" aria-label="CineVortex">
                    <svg class="cv-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="9" fill="#e5242f"/><circle cx="16" cy="16" r="10.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.4"/><path d="M13 10.2v11.6l9.4-5.8z" fill="#fff"/></svg>
                    <span class="cv-wordmark">Cine<b>Vortex</b></span>
                </span>
                <p class="cv-footer__line">Your cinematic destination.</p>
            </div>
            <!-- For creatorrio // credit --- Please don't remove footer credit -->
            <p class="cv-footer__copy">&copy; <script type="text/JavaScript">
                var theDate=new Date() 
                    document.write(theDate.getFullYear()) 
            </script> CineVortex. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.plyr.io/3.6.12/plyr.js"></script>
	<script>
        const controls = [
              'play-large',
              'rewind',
              'play', 
              'fast-forward', 
              'progress', 
              'current-time',
              'duration',
              'mute',
              'volume',
              'captions',
              'settings',
              'pip',
              'airplay',
              'download',
              'fullscreen'
            ];
        document.addEventListener('DOMContentLoaded', () => {
            const player = Plyr.setup('.player', { controls });
        });


    </script>
    <script>
        /* CineVortex presentation only: file-type badge, full name on hover, download feedback */
        (function () {
            try {
                var n = document.getElementById('myDiv');
                if (n) {
                    var full = (n.textContent || '').replace(/\s+/g, ' ').trim();
                    if (full) {
                        n.setAttribute('title', full);
                        var m = /\.([A-Za-z0-9]{2,5})$/.exec(full);
                        var e = document.getElementById('cv-ext');
                        if (m && e) { e.textContent = m[1].toUpperCase(); e.hidden = false; }
                    }
                }
                var a = document.getElementById('cv-download');
                var h = document.getElementById('cv-hint');
                if (a && h) {
                    a.addEventListener('click', function () {
                        a.classList.add('is-busy');
                        h.textContent = 'Starting your download\u2026';
                        setTimeout(function () { a.classList.remove('is-busy'); h.textContent = ''; }, 6000);
                    });
                }
            } catch (err) {}
        })();
    </script>
    <script>
           var div = document.getElementById('myDiv');
           var text = div.textContent;
   
           if(text.length > 60){
               div.textContent = text.slice(0, 60)+"....";
           }
   
       </script>
</body>
</html>
